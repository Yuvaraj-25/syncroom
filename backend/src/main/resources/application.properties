# =========================================================
# SERVER CONFIGURATION
# =========================================================
# Render/Railway automatically provides PORT
server.port=${PORT:4000}

# Required for Render/Reverse Proxy to handle X-Forwarded headers correctly
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto


# =========================================================
# SUPABASE / POSTGRESQL DATABASE
# =========================================================
# Credentials are provided through Render Environment Variables

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate 7+ auto-detects PostgreSQL dialect; explicit setting causes deprecation warning
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# HIKARI CONNECTION POOL (Supabase Pooler optimized)
# =========================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000


# =========================================================
# CORS CONFIGURATION
# =========================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}


# =========================================================
# JWT SECURITY
# =========================================================
jwt.secret=${JWT_SECRET:syncroom_jwt_super_secure_secret_key_minimum_256_bits_length_1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# =========================================================
# YOUTUBE API
# =========================================================
youtube.api.key=${YOUTUBE_API_KEY:}


# =========================================================
# OPENROUTER / AI ASSISTANT
# =========================================================
openrouter.api.key=${OPENROUTER_API_KEY:}


# =========================================================
# LOGGING
# =========================================================
logging.level.root=INFO
logging.level.com.project=DEBUG
logging.level.org.springframework.web.socket=INFO


# =========================================================
# FILE UPLOAD
# =========================================================
file.upload.dir=./uploads
file.upload.max-size=52428800

file.upload.allowed-types=image/*,video/*,audio/*,application/pdf,text/*,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip,application/x-zip-compressed


# =========================================================
# ACTUATOR / HEALTH CHECKS
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true